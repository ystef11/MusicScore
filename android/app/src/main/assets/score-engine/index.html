<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta charset="utf-8">
<style>html{overflow-anchor:none}body{margin:0;background:white;color:#222}svg{width:100%;height:auto;display:block}#error{white-space:pre-wrap}#error:not(:empty){padding:16px}#cursor{display:none;position:absolute;z-index:2;pointer-events:auto;touch-action:none;cursor:grab;user-select:none}#cursor::after{content:'';position:absolute;left:50%;transform:translateX(-50%);width:var(--cursor-line-width,3px);height:100%;background:#168cff88;pointer-events:none}#cursor.dragging{cursor:grabbing}#pages{display:flex;width:max-content;min-width:var(--score-viewport-width);align-items:flex-start;user-select:none;touch-action:none}#pages[data-layout="1"]{flex-direction:column;align-items:center}#pages>section{position:relative;overflow:hidden;flex:none;width:var(--score-page-width);background:white}#pages[data-layout="2"]>section{margin-inline:var(--score-page-gutter)}#pages>section>img,#pages>section>svg{display:block;width:100%;height:auto}#pages>section[data-state="missing"]>img{visibility:hidden}#pages>section[data-state="pending"]::after,#pages>section[data-state="missing"]::after{position:absolute;inset:0;display:grid;place-items:center;color:#555;pointer-events:none}#pages>section[data-state="missing"]::after{content:'Страница недоступна'}#pages>section[data-state="pending"]::after{content:'Страница загружается…'}#metronome-status{position:fixed;bottom:8px;left:8px;right:8px;z-index:3;background:#fff;color:#222;padding:8px;pointer-events:none;border-radius:4px}</style>
<style>#pages>section>.note-hints{position:absolute;left:0;top:var(--note-hints-top,0%);width:100%;height:var(--note-hints-height,100%);pointer-events:none}#pages:not([data-note-hints]) .note-hints{display:none}.note-hints text{fill:#005c54;stroke:white;paint-order:stroke;stroke-linejoin:round;text-anchor:middle;font-family:system-ui,sans-serif;font-weight:700}</style>
</head><body><div id="error"></div><main id="pages"></main><div id="cursor"></div><div id="metronome-status" role="status" hidden>Метроном недоступен: для этой записи нет карты долей.</div>
<script>
// Android's file:// asset URLs need XHR rather than Chromium's fetch transport.
const nativeFetch=window.fetch.bind(window);
window.fetch=(url,options)=>String(url).startsWith('file:')?new Promise((resolve,reject)=>{
 const xhr=new XMLHttpRequest();xhr.open('GET',String(url));xhr.responseType='arraybuffer';
 xhr.onload=()=>xhr.status===0||xhr.status===200?resolve(new Response(xhr.response,{headers:{'Content-Type':String(url).endsWith('.wasm')?'application/wasm':'application/octet-stream'}})):reject(Error('Asset read failed: '+url));
 xhr.onerror=()=>reject(Error('Asset read failed: '+url));xhr.send();
}):nativeFetch(url,options);
var MSCORE_SCRIPT_URL=location.href;
const emit=(event,data)=>window.ReactNativeWebView?.postMessage(JSON.stringify({event,data}));
window.onerror=(_,__,___,____,error)=>emit('engineError',String(error||_));
window.onunhandledrejection=e=>emit('engineError',String(e.reason));
</script><script src="audio-clock.js"></script><script src="midi-rhythm.js"></script><script src="web-score-coordinates.js"></script><script src="pitch-audio.js"></script><script src="note-anchors.js"></script><script src="playback-support.js"></script><script src="cursor.js"></script><script src="note-hints.js"></script><script src="page-layout.js"></script><script src="loop-selection.js"></script><script src="keyboard-audio.js"></script><script src="engine.js"></script><script src="touch-navigation.js"></script></body></html>
