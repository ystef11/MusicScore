apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    // Package JavaScript in debug APKs too, so Android Studio launch works without Metro.
    debuggableVariants = []
    entryFile = file("../../index.ts")
    cliFile = file("../../scripts/bundle-cli.cjs")
    extraPackagerArgs = ["--max-workers", "2"]
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion = rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    externalNativeBuild { cmake { path "src/main/jni/CMakeLists.txt"; version = "3.30.5" } }
    namespace = "com.musescore.client"
    // Never package protected libraries from the recovered APK, including stale intermediates.
    packaging {
        jniLibs {
            excludes += [
                "**/libpairipcore.so",
                "**/libXtzAndroid.so",
                "**/libXtzJsiBridge.so"
            ]
        }
    }
    defaultConfig {
        testInstrumentationRunner "com.musescoremobile.WebScoreProbe"
        applicationId "com.musescore.client"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2701764
        versionName "2.14.54"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig = signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation(platform("com.google.firebase:firebase-bom:34.6.0"))
    implementation("com.google.firebase:firebase-appcheck-playintegrity")
    implementation("com.caverock:androidsvg:1.4")
    implementation(files("libs/original-file-import.jar"))
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

tasks.withType(com.facebook.react.tasks.BundleHermesCTask).configureEach { sources.exclude("recovery/**") }

// Reused startup verification from the existing Android project.
tasks.register('runRelease') {
    group = 'application'
    description = 'Install, launch and check the recovered app; fail if startup crashes.'
    dependsOn 'assembleRelease'
    doLast {
        def adb = androidComponents.sdkComponents.adb.get().asFile
        def runAdb = { List<String> args ->
            def process = new ProcessBuilder([adb.absolutePath] + args).redirectErrorStream(true).start()
            def output = new StringBuffer()
            def outputThread = process.consumeProcessOutputStream(output)
            if (!process.waitFor(60, java.util.concurrent.TimeUnit.SECONDS)) {
                process.destroyForcibly()
                throw new GradleException("ADB timed out: ${args}")
            }
            outputThread.join(5000)
            if (process.exitValue() != 0) throw new GradleException("ADB failed: ${output}")
            output.toString().trim()
        }
        def serial = providers.gradleProperty('deviceSerial').orNull ?: System.getenv('ANDROID_SERIAL')
        if (!serial) {
            def devices = runAdb(['devices']).readLines().findAll { it ==~ /\S+\s+device/ }
                .collect { it.tokenize()[0] }
            // adb connect localhost can expose the same emulator twice.
            devices = devices.findAll { candidate ->
                def local = candidate =~ /(?:127\.0\.0\.1|localhost):(\d+)/
                !(local.matches() && devices.contains('emulator-' + (local[0][1].toInteger() - 1)))
            }
            if (devices.size() != 1) {
                throw new GradleException("Select one connected device with -PdeviceSerial=<serial>. Online: ${devices}")
            }
            serial = devices[0]
        }
        def deviceAdb = { List<String> args -> runAdb(['-s', serial] + args) }
        def abi = deviceAdb(['shell', 'getprop', 'ro.product.cpu.abi'])
        logger.lifecycle("Running on ${serial}, primary ABI ${abi}")
        if (abi != 'arm64-v8a') {
            if (abi != 'x86_64') logger.warn("No native libraries supplied for primary ABI ${abi}; Android may use a secondary ABI.")
        }
        logger.lifecycle(deviceAdb(['install', '-r', layout.buildDirectory.file("outputs/apk/release/app-release.apk").get().asFile.absolutePath]))
        deviceAdb(['shell', 'am', 'force-stop', 'com.musescore.client'])
        def deviceTime = deviceAdb(['shell', 'date', '+%m-%d_%H:%M:%S.000']).replace('_', ' ')
        logger.lifecycle(deviceAdb(['shell', 'am', 'start', '-W', '-n',
            'com.musescore.client/com.musescore.client.MainActivity']))
        // am start can return "Status: ok" even when Application initialization crashes.
        Thread.sleep(15000)
        def activity = deviceAdb(['shell', 'dumpsys', 'activity', 'activities'])
        def resumed = activity.readLines().findAll {
            it.contains('mResumedActivity:') || it.contains('topResumedActivity=')
        }
        def report = layout.buildDirectory.file('reports/startup/logcat.txt').get().asFile
        report.parentFile.mkdirs()
        report.text = deviceAdb(['logcat', '-d', '-v', 'threadtime', '-T', deviceTime,
            'libc:F', 'DEBUG:F', 'AndroidRuntime:E', 'ReactNativeJS:E', 'nativeloader:D', '*:S'])
        if (!resumed.any { it.contains('com.musescore.client/com.musescore.client.MainActivity') }) {
            throw new GradleException("Startup failed: MainActivity is not resumed. Log: ${report}\n${report.text}")
        }
        logger.lifecycle("MainActivity is resumed after 15 seconds. Startup log: ${report}")
    }
}



// Available under app > verification in Android Studio's Gradle panel.
tasks.register('verifyWebScoreDownloader', Exec) {
    group = 'verification'
    description = 'Check alternate score links, real-file validation, caching and HTTP failure handling.'
    workingDir rootProject.file('..')
    commandLine 'node', 'recovery/test-web-score.cjs'
}

// Separate task-owned outputs; the React plugin also compiles the old shared root.
// Exclude stale files there after switching an existing checkout to these roots.
def packageListDir = layout.buildDirectory.dir("generated/packageList/java")
def entryPointDir = layout.buildDirectory.dir("generated/reactEntryPoint/java")
tasks.named("generateAutolinkingPackageList", com.facebook.react.tasks.GeneratePackageListTask) {
    generatedOutputDirectory.set(packageListDir)
}
tasks.named("generateReactNativeEntryPoint", com.facebook.react.tasks.GenerateEntryPointTask) {
    generatedOutputDirectory.set(entryPointDir)
}
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    variant.sources.java.addStaticSourceDirectory(packageListDir.get().asFile.absolutePath)
    variant.sources.java.addStaticSourceDirectory(entryPointDir.get().asFile.absolutePath)
}
tasks.withType(JavaCompile).configureEach {
    exclude { item -> item.file.absolutePath.replace('\\', '/').contains('/generated/autolinking/src/main/java/') }
}
